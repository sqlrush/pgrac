<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">undo 段头初始归属优化前后</title><desc id="desc">优化前可能跨节点协调段头权威；优化后初始归属与undo所属实例靠近，但GRD和所有安全检查保留。</desc>
<style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#172b3a}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526775}.label{font-size:18px}.num{font-size:18px;font-weight:700}.small{font-size:15px;fill:#526775}.axis{stroke:#cad4dc;stroke-width:1}.before{fill:#b96031}.after{fill:#007e91}</style>
<rect width="100%" height="100%" rx="12" fill="#fafbfc"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526775"/></marker></defs><text x="40" y="48" class="title">优化位置：undo 段头资源的初始 master 归属</text><text x="40" y="80" class="sub">功能示意，不是精确消息计数；节点角色可能重合；原有校验与队列保持不变</text><text x="40" y="130" class="num">优化前：段头初始 master 按普通散列分布，可能在远端</text><rect x="40" y="165" width="215" height="78" rx="9" fill="#e8eef3" stroke="#aabcc8"/><text x="147.5" y="195" text-anchor="middle" class="label">UPDATE / CR</text><text x="147.5" y="220" text-anchor="middle" class="small">等待所需 undo</text><rect x="330" y="165" width="300" height="78" rx="9" fill="#e8eef3" stroke="#aabcc8"/><text x="480" y="195" text-anchor="middle" class="label">undo 所属实例</text><text x="480" y="220" text-anchor="middle" class="small">origin 串行推进段头访问</text><rect x="735" y="165" width="345" height="78" rx="9" fill="#e8eef3" stroke="#aabcc8"/><text x="907.5" y="195" text-anchor="middle" class="label">可能远端的段头 master</text><text x="907.5" y="220" text-anchor="middle" class="small">既有 GES 取权 / 释放</text><line x1="255" y1="201" x2="330" y2="201" stroke="#526775" stroke-width="2" marker-end="url(#arrow)"/><line x1="630" y1="187" x2="735" y2="187" stroke="#526775" stroke-width="2" marker-end="url(#arrow)"/><line x1="735" y1="222" x2="630" y2="222" stroke="#526775" stroke-width="2" marker-end="url(#arrow)"/><text x="665" y="167" class="small">协调</text><text x="40" y="286" class="sub">远端协调延长 origin 驻留；等待中的 CR 请求也会延迟完成。</text><line x1="40" x2="1080" y1="316" y2="316" class="axis"/><text x="40" y="359" class="num">优化后：初始映射让本实例 undo 段头的 master 与 origin 靠近</text><rect x="40" y="397" width="215" height="78" rx="9" fill="#e8eef3" stroke="#aabcc8"/><text x="147.5" y="427" text-anchor="middle" class="label">UPDATE / CR</text><text x="147.5" y="452" text-anchor="middle" class="small">仍可跨节点请求 undo</text><rect x="330" y="397" width="300" height="78" rx="9" fill="#dff0f1" stroke="#aabcc8"/><text x="480" y="427" text-anchor="middle" class="label">undo 所属实例</text><text x="480" y="452" text-anchor="middle" class="small">origin 与初始段头 master</text><rect x="735" y="397" width="345" height="78" rx="9" fill="#e8eef3" stroke="#aabcc8"/><text x="907.5" y="427" text-anchor="middle" class="label">原 GRD master 映射</text><text x="907.5" y="452" text-anchor="middle" class="small">仍负责权威 / 重映射 / 拒绝</text><line x1="255" y1="434" x2="330" y2="434" stroke="#526775" stroke-width="2" marker-end="url(#arrow)"/><line x1="630" y1="434" x2="735" y2="434" stroke="#526775" stroke-width="2" marker-end="url(#arrow)"/><text x="339" y="508" class="small">取权、证明、释放仍执行；优先本地协调</text><text x="40" y="554" class="sub">不是删除 RPC，不是跳过锁，不是“owner 永远等于 master”。</text><text x="40" y="586" class="sub">成员变化后的权威仍由现有 master map 决定；不支持在线混版本切换。</text></svg>
