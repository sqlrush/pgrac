<title id="title">UPDATE 延迟组成对比</title><desc id="desc">对照整笔211.950毫秒，候选92.933毫秒。CR独占由114.282降至10.810毫秒。</desc>
<style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#172b3a}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526775}.label{font-size:18px}.num{font-size:18px;font-weight:700}.small{font-size:15px;fill:#526775}.axis{stroke:#cad4dc;stroke-width:1}.before{fill:#b96031}.after{fill:#007e91}</style>
<rect width="100%" height="100%" rx="12" fill="#fafbfc"/><text x="40" y="48" class="title">整笔延迟下降，主要来自 CR 获取等待缩短</text><text x="40" y="79" class="sub">独立埋点诊断 · 每笔成功测量事务均值 · 单位 ms · 不用于计算正式 TPS</text><text x="40" y="168" class="label">优化前</text><rect x="180.000" y="140" width="394.273" height="43" fill="#b96031"/><rect x="574.273" y="140" width="283.205" height="43" fill="#476c85"/><rect x="857.478" y="140" width="1.076" height="43" fill="#8798a5"/><rect x="858.554" y="140" width="52.672" height="43" fill="#007e91"/><text x="923.2258619409695" y="168" class="num">211.950</text><text x="184" y="207" class="small">CR 114.282　其他执行器 82.088　往返余项 0.312　COMMIT 15.267</text><text x="40" y="272" class="label">优化后</text><rect x="180.000" y="244" width="37.294" height="43" fill="#b96031"/><rect x="217.294" y="244" width="235.689" height="43" fill="#476c85"/><rect x="452.983" y="244" width="0.888" height="43" fill="#8798a5"/><rect x="453.871" y="244" width="46.749" height="43" fill="#007e91"/><text x="512.6203455928003" y="272" class="num">92.933</text><text x="184" y="311" class="small">CR 10.810　其他执行器 68.316　往返余项 0.258　COMMIT 13.550</text><rect x="50" y="362" width="16" height="16" fill="#b96031"/><text x="74" y="376" class="small">CR 获取</text><rect x="305" y="362" width="16" height="16" fill="#476c85"/><text x="329" y="376" class="small">其他执行器</text><rect x="560" y="362" width="16" height="16" fill="#8798a5"/><text x="584" y="376" class="small">执行器外余项</text><rect x="815" y="362" width="16" height="16" fill="#007e91"/><text x="839" y="376" class="small">COMMIT 往返</text><line x1="40" x2="1080" y1="404" y2="404" class="axis"/><text x="40" y="447" class="title">CR：114.282 → 10.810 ms（−90.5%）</text><text x="40" y="486" class="label">执行器总减少 117.245 ms，其中 CR 算术差值为 103.472 ms（88.3%）。</text><text x="40" y="526" class="sub">来源：measurements.json；分项为独占墙钟，彼此不重复；不是 CPU 时间。</text><text x="40" y="558" class="sub">对照采样有 1 条真实错误，保留为失败诊断；上图仅描述其中成功记录。</text><text x="40" y="590" class="sub">候选采样零错误；稳定性另由埋点关闭的吞吐对照和正式 PRE 验证。</text></svg>
