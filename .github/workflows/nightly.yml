# Current MVP release CI. Historical extended tests live in legacy-extended.yml.
# Together with every required fast.yml job, this workflow must pass on the
# exact release commit. Docs-only skips and older-commit results do not qualify.
# Author: SqlRush <sqlrush@gmail.com>
# Portions Copyright (c) 2026, pgrac contributors

name: PGRAC MVP release CI

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  linux-pg-regress:
    name: Linux PG 219 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang \
            libreadline-dev zlib1g-dev libicu-dev \
            liblz4-dev libzstd-dev libssl-dev libxml2-dev \
            libipc-run-perl pkg-config

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ github.job }}-ccache-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-ccache-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --max-size=700M
          ccache --zero-stats

      - name: Configure (--enable-cluster)
        run: |
          CC="ccache gcc" ./configure \
            --prefix=$HOME/pgrac-install \
            --enable-cassert --enable-debug \
            --with-openssl --with-icu --with-lz4 --with-zstd \
            --enable-cluster --enable-tap-tests

      - name: Build and install
        run: |
          make -j$(getconf _NPROCESSORS_ONLN)
          ccache --show-stats
          make install

      - name: Run PG regression tests (219 tests)
        run: make check

      - name: Install native quorum fixture dependencies
        run: |
          sudo systemctl mask --runtime corosync.service corosync-qdevice.service corosync-qnetd.service
          sudo apt-get install -y --no-install-recommends corosync corosync-qdevice corosync-qnetd libnss3-tools iproute2
          sudo modprobe loop

      - name: Run native four-member undo refusal TAP
        run: |
          # This Linux-only quorum test remains mandatory in nightly.
          # The macOS job executes the other five members of the same set.
          sudo python3 -B scripts/ci/run_native_smoke.py \
            --source "$GITHUB_WORKSPACE" --install "$HOME/pgrac-install" \
            --output "$RUNNER_TEMP/pgrac-native-smoke" --vendor / \
            --uid "$(id -u)" --gid "$(id -g)" --commit "$GITHUB_SHA"

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-native-smoke
          path: ${{ runner.temp }}/pgrac-native-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload regression diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pg-regress-diffs
          path: |
            src/test/regress/regression.diffs
            src/test/regress/regression.out
            src/test/regress/log/
          if-no-files-found: ignore
          retention-days: 14

  build-test-macos:
    name: macOS Build+Test (smoke)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install macOS dependencies
        run: |
          brew install readline icu4c lz4 zstd openssl@3 libxml2 cpanminus pkg-config ccache || true
          cpanm --local-lib=$HOME/perl5 --notest IPC::Run IO::Tty
          {
            echo "PERL5LIB=$HOME/perl5/lib/perl5"
            echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix lz4)/lib/pkgconfig:$(brew --prefix zstd)/lib/pkgconfig"
            echo "LDFLAGS=-L$(brew --prefix readline)/lib -L$(brew --prefix zstd)/lib -L$(brew --prefix lz4)/lib -L$(brew --prefix openssl@3)/lib -L$(brew --prefix icu4c)/lib"
            echo "CPPFLAGS=-I$(brew --prefix readline)/include -I$(brew --prefix zstd)/include -I$(brew --prefix lz4)/include -I$(brew --prefix openssl@3)/include -I$(brew --prefix icu4c)/include"
          } >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ github.job }}-ccache-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-ccache-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --max-size=700M
          ccache --zero-stats

      - name: Configure (--enable-cluster)
        run: |
          CC="ccache clang" ./configure \
            --prefix=$HOME/pgrac-install \
            --enable-cassert --enable-debug \
            --with-openssl --with-icu --with-lz4 --with-zstd \
            --enable-cluster --enable-tap-tests

      - name: Build and install
        run: |
          make -j$(sysctl -n hw.ncpu)
          ccache --show-stats
          make install

      - name: Run PG regression tests (219 tests)
        run: make check

      - name: Run cluster smoke (unit + regress + curated TAP)
        run: |
          make -j$(sysctl -n hw.ncpu) -C src/test/cluster_unit check
          make -C src/test/cluster_regress check
          SMOKE="$(python3 scripts/ci/mvp_ci.py --smoke-local)"
          make -C src/test/cluster_tap check PROVE_TESTS="$SMOKE"

      - name: Upload regression diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-diffs-macos
          path: |
            src/test/cluster_regress/regression.diffs
            src/test/cluster_regress/regression.out
            src/test/cluster_regress/log/
            src/test/regress/regression.diffs
            src/test/regress/regression.out
            src/test/regress/log/
            src/test/cluster_tap/tmp_check/log/
          if-no-files-found: ignore
          retention-days: 14
