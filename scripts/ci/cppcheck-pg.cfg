<?xml version="1.0"?>
<!--
  cppcheck-pg.cfg: PostgreSQL contracts not inferred from extension headers.
  Author: SqlRush <sqlrush@gmail.com>
  Portions Copyright (c) 2026, pgrac contributors
  These are function contracts, not finding suppressions. In particular,
  errfinish is not noreturn: NOTICE/WARNING calls return to their caller.
-->
<def format="2">
  <function name="ExceptionalCondition">
    <noreturn>true</noreturn>
    <arg nr="1"/>
    <arg nr="2"/>
    <arg nr="3"/>
  </function>
  <function name="cold_redo_refuse">
    <!-- Declared pg_attribute_noreturn(); its sole exit is ereport(FATAL). -->
    <noreturn>true</noreturn>
    <arg nr="1"/>
    <arg nr="2"/>
  </function>
  <function name="pfree">
    <!-- A function call, including when its argument is *arrays[i]. -->
    <noreturn>false</noreturn>
    <arg nr="1"/>
  </function>
</def>
